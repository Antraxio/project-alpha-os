name: Project Alpha validation and screenshots

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["screenshots/**"]

permissions:
  contents: write

concurrency:
  group: project-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit tests
        run: npm test

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start checked-out site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/project-alpha-http.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/project-alpha-http.log
          exit 1

      - name: Validate UI and capture screenshots
        run: npm run test:screenshots

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: project-alpha-screenshots
          path: screenshots/*.png
          retention-days: 30
          if-no-files-found: error

      - name: Commit screenshots on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes."
          else
            git commit -m "chore: update website screenshots [skip ci]"
            git push
          fi
