name: Project Alpha validation and screenshots

on:
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Explicitly replace approved screenshot baselines
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["screenshots/**"]

permissions:
  contents: read

concurrency:
  group: project-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.update_baselines != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Unit, differential, compatibility and syntax tests
        run: |
          npm test
          npm run test:syntax
          npm run build:data
          git diff --exit-code -- alpha-data.json
          git diff --check
      - run: npx playwright install --with-deps chromium
      - name: Start checked-out site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/project-alpha-http.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          cat /tmp/project-alpha-http.log
          exit 1
      - name: Functional and approved screenshot regression tests
        run: npm run test:screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-alpha-screenshots
          path: |
            screenshots/*.png
            screenshots/diffs/*.png
          retention-days: 30
          if-no-files-found: error

  publish-screenshots:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: project-alpha-screenshots
          path: screenshots
      - name: Publish generated screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update website screenshots [skip ci]"
          git push

  update-approved-baselines:
    if: github.event_name == 'workflow_dispatch' && inputs.update_baselines == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start checked-out site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/project-alpha-http.log 2>&1 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ > /dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: UPDATE_SCREENSHOT_BASELINES=1 npm run test:screenshots
      - name: Commit explicitly approved baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/baselines/*.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: update approved screenshot baselines"
          git push
